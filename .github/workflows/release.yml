# Official releases. Push a tag `vX.Y.Z` (matching .claude-plugin/plugin.json) and this job runs the
# structure checks, zips the five skill folders and publishes them as a GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: version in plugin.json must match the tag
        run: |
          v=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "plugin.json says $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: structure checks
        run: python tests/check_skills.py
      - name: pack the skills
        run: |
          mkdir dist
          python - <<'EOF'
          import os, zipfile
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with zipfile.ZipFile(f"dist/unity-agent-{v}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("skills"):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, "."))
              for extra in ("README.md", "LICENSE"):
                  z.write(extra, extra)
          EOF
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "unity-agent ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Install: unzip and link or copy each folder under skills/ into your agent's skills folder (~/.claude/skills, ~/.agents/skills, ~/.copilot/skills or .cursor/skills), or clone the repository and add it as a Claude Code marketplace. Reasoned changes: each skill's CHANGELOG.md."
